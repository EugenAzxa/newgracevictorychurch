<!DOCTYPE html>
<!-- Source for assets/og-image.jpg. Regenerate by screenshotting this at 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@500;600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #2D3041; color: #fff;
    font-family: "Work Sans", sans-serif;
    display: grid; place-items: center; position: relative;
  }
  .rays {
    position: absolute; left: 50%; top: -740px;
    width: 1700px; height: 1700px; transform: translateX(-50%);
    background: repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(247,186,0,.16) 0deg 2.4deg, transparent 2.4deg 7.4deg);
    border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 4%, rgba(0,0,0,.55) 30%, transparent 56%);
            mask-image: radial-gradient(circle at 50% 50%, #000 4%, rgba(0,0,0,.55) 30%, transparent 56%);
  }
  .inner { position: relative; text-align: center; padding: 0 90px; }
  .badge {
    width: 122px; height: 122px; border-radius: 50%;
    background: #FDFBF6; display: grid; place-items: center;
    margin: 0 auto 32px; box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  .badge img { width: 100px; height: 100px; display: block; }
  h1 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: 62px; line-height: 1.08; letter-spacing: -.025em;
  }
  h1 em { font-style: normal; color: #F7BA00; }
  p.tag {
    margin-top: 26px; font-size: 22px; color: #B5B8C4; letter-spacing: .005em;
  }
  p.meta {
    margin-top: 34px; font-size: 15px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: #F7BA00;
  }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="inner">
    <span class="badge"><img src="../assets/logo.png" alt=""></span>
    <h1>Where grace abounds,<br><em>victory is sure.</em></h1>
    <p class="tag">New Grace Victory Church &middot; North York, Toronto</p>
    <p class="meta">Sundays 10:00 AM &nbsp;&middot;&nbsp; In person &amp; online</p>
  </div>
</body>
</html>
